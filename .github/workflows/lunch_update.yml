name: Auto Update Lunch Map

on:
  schedule:
    - cron: '0 2 * * 1-5' # 월~금 한국시간 11:00 (UTC 02:00)
  workflow_dispatch: 
  push:
    paths:
      - '오정메뉴.jpg'
      - 'lunchmapup.py'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Virtual Display (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run lunch script with Virtual Display
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 > /dev/null 2>&1 &
          python lunchmapup.py

      - name: Commit and push generated html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add gasan_lunch_map.html
          git commit -m "Auto-update lunch map for today" || exit 0
          git push
