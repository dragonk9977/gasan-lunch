name: Auto-update lunch map

on:
  schedule:
    - cron: '30 1 * * 1-5'
  repository_dispatch:
    types: [update_lunch]
  workflow_dispatch:
    inputs:
      menu_text:
        description: '테스트용 메뉴 텍스트 입력'
        required: false
        default: '테스트 메뉴입니다.'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lunch script
        env:
          MENU_TEXT: ${{ github.event.client_payload.menu_text || github.event.inputs.menu_text }}
        run: |
          python lunchmapup.py

      - name: Commit and push generated html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gasan_lunch_map.html
          git commit -m "Auto-update lunch map for today" || exit 0
          git pull origin main --rebase
          git push
